version: 2

sources:
  - name: raw
    database: roche-data-platform
    schema: raw
    description: Bronze layer loaded by the Python ingestion jobs (tables) and FAERS Parquet in the lake (external tables).
    tables:
      - name: ecb_fx_rates
        description: ECB daily reference rates, USD and CHF per EUR.
      - name: ct_studies
        description: ClinicalTrials.gov daily snapshot of studies where Roche or Genentech is sponsor or collaborator.
      - name: fda_recalls
        description: openFDA drug enforcement reports (recalls) for Genentech / Roche.
      - name: cms_part_d
        description: Medicare Part D Spending by Drug (wide format, one column per year, all strings).
      - name: cms_part_b
        description: Medicare Part B Spending by Drug (wide format, no manufacturer column).
      - name: faers_demo
        description: FAERS demographics, one row per report version (external table over Parquet, partitioned by quarter).
      - name: faers_drug
        description: FAERS drugs per report (external table).
      - name: faers_reac
        description: FAERS reactions, MedDRA preferred terms (external table).
      - name: faers_outc
        description: FAERS patient outcomes (external table).
      - name: faers_stream_events
        description: Adverse event intake stream loaded by the Kafka consumer (at-least-once, may contain duplicates).
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 30, period: day}

  - name: ops
    database: roche-data-platform
    schema: ops
    tables:
      - name: ingestion_runs
        description: One row per Python ingestion run (written by run_tracker).
        config:
          loaded_at_field: started_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
      - name: kafka_consumer_metrics
        description: One row per Kafka consumer micro-batch.
