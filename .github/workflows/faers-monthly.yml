# FDA publishes FAERS quarterly (~1 month after quarter end). Checking monthly for the last
# 2 completed quarters is idempotent: already loaded quarters are skipped, unpublished ones too.
name: FAERS + CMS monthly

on:
  schedule:
    - cron: "0 6 5 * *"   # 06:00 UTC on the 5th of every month
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: roche-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest FAERS + CMS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: sa-ingestion@roche-data-platform.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ingestion.batch.faers --recent 2
      - run: python -m ingestion.batch.cms_spending

  transform:
    name: dbt build
    runs-on: ubuntu-latest
    needs: ingest
    env:
      DBT_IMPERSONATE_SA: ""
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: sa-dbt@roche-data-platform.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "dbt-bigquery>=1.12,<1.13"
      - run: dbt deps
      - run: dbt build --profiles-dir .
