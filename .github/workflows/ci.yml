# Runs on every pull request (and on demand): unit tests, Terraform checks and a full dbt build
# in the auto-expiring dbt_ci dataset, so a change is tested on real data without touching production.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for keyless auth (Workload Identity Federation)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  terraform-checks:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  dbt-ci:
    name: dbt build (dbt_ci dataset)
    runs-on: ubuntu-latest
    needs: python-tests
    env:
      DBT_IMPERSONATE_SA: ""   # already authenticated as sa-dbt through WIF
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: sa-dbt@roche-data-platform.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "dbt-bigquery>=1.12,<1.13"
      - run: dbt deps
      - run: dbt build --target ci --profiles-dir .
