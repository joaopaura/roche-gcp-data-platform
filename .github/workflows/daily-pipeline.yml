# Daily batch pipeline: ingestion (parallel, one job per source) -> dbt build + freshness.
# The shared concurrency group prevents two pipeline runs from overlapping
# (the incident observed during development, when two FAERS loads ran at the same time).
name: Daily pipeline

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC every day
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: roche-pipeline
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: roche-data-platform

jobs:
  ingest:
    name: Ingest ${{ matrix.source }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [ecb_fx, clinical_trials, openfda_enforcement]
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: sa-ingestion@roche-data-platform.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ingestion.batch.${{ matrix.source }}

  transform:
    name: dbt build
    runs-on: ubuntu-latest
    needs: ingest
    if: ${{ !cancelled() }}   # still transform when one source failed (the others are fresh)
    env:
      DBT_IMPERSONATE_SA: ""
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: sa-dbt@roche-data-platform.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "dbt-bigquery>=1.12,<1.13"
      - run: dbt deps
      - run: dbt source freshness --profiles-dir .
        continue-on-error: true
      - run: dbt build --profiles-dir .
